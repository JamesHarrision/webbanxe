services:
  db:
    image: postgres:15-alpine
    container_name: vinfast-db
    restart: always
    environment:
      POSTGRES_USER: vinfaster
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: vinfast_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinfaster -d vinfast_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vinfast-network

  main-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vinfast-main-backend
    restart: always
    ports:
      - "6868:6868" # Corrected port from .env
    environment:
      - DATABASE_URL=postgresql://vinfaster:securepassword@db:5432/vinfast_db
      - PORT=6868
      - JWT_SECRET=vinfast_tiengiang_secret_key_2026_!@#
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vinfast-network

networks:
  vinfast-network:
    driver: bridge

volumes:
  postgres-data:
